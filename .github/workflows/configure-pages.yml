name: Configure GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy from"
        required: true
        type: string
        default: "main"

      path:
        description: "Publishing path"
        required: true
        type: choice
        options:
          - /
          - /docs

jobs:
  configure-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub CLI
        run: |
          echo "PATH=$PATH"
          which gh
          gh --version

      - name: Configure GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          PUBLISH_PATH: ${{ inputs.path }}
        run: |
          echo "PATH=$PATH"
          which gh
          gh --version

          echo "Repository: $REPOSITORY"
          echo "Branch: $BRANCH"
          echo "Path: $PUBLISH_PATH"

          gh api \
            --method PUT \
            "/repos/$REPOSITORY/pages" \
            --input - <<EOF
          {
            "build_type": "legacy",
            "source": {
              "branch": "$BRANCH",
              "path": "$PUBLISH_PATH"
            }
          }
          EOF
