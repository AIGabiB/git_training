name: Configure GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy from"
        required: true
        type: string
        default: "feat/gh-pages"

      path:
        description: "Publishing path"
        required: true
        type: choice
        options:
          - /
          - /docs

jobs:
  configure-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Configure GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          PATH: ${{ inputs.path }}
        run: |
          echo "Installing GitHub CLI..."

          sudo apt-get update
          sudo apt-get install -y gh

          echo "GitHub CLI version:"
          gh --version

          echo "Repository: $REPOSITORY"
          echo "Branch: $BRANCH"
          echo "Path: $PATH"

          echo "Configuring GitHub Pages..."

          gh api \
            --method PUT \
            "/repos/$REPOSITORY/pages" \
            --input - <<EOF
          {
            "build_type": "legacy",
            "source": {
              "branch": "$BRANCH",
              "path": "$PATH"
            }
          }
          EOF
